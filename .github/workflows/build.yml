name: Build

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "registry/**"
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and run self tests
        run: ./gradlew --no-daemon check :cli:installDist
      - name: Check that the build is reproducible
        run: |
          sha256sum cli/build/libs/*.jar core/build/libs/*.jar > first.sha256
          ./gradlew --no-daemon clean :cli:jar :core:jar
          sha256sum -c first.sha256
      - name: Smoke test
        run: cli/build/install/bcz/bin/bcz --help
