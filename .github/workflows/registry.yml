# Runs on main after a pull request was merged, daily and on demand:
#   1. builds every release that has no build record yet, twice, without secrets,
#   2. signs a build record with the registry key if both builds match and the scan is clean,
#   3. if registry/policy.toml sets ai_prereview = true: runs an AI pre-analysis of every new build
#      (report for the human reviewer, signed by the registry; never an approval),
#   4. publishes the signed launcher index to the "index" branch.
# Environments: "registry-signing" holds BITECHECK_REGISTRY_KEY; "ai-review" holds the AI credential
# (COPILOT_GITHUB_TOKEN, or ANTHROPIC_API_KEY with the repository variable AI_PREREVIEW_BACKEND=anthropic).
# The model never runs in a job that has the registry key.
name: Registry

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "keys/**"
  schedule:
    - cron: "17 3 * * *" # keeps the index fresh; launchers distrust indexes older than 7 days
  workflow_dispatch:

concurrency:
  group: registry-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pending:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.find.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: find
        run: python3 .github/scripts/pending.py >> "$GITHUB_OUTPUT"

  build-a:
    needs: pending
    if: needs.pending.outputs.releases != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.releases) }}
    uses: ./.github/workflows/build-mod.yml
    with:
      release: ${{ matrix.release }}
      key: ${{ matrix.key }}
      builder: a
      runner: ubuntu-24.04
      registry_ref: ${{ github.sha }}
      tools_ref: ${{ github.sha }}

  build-b:
    needs: pending
    if: needs.pending.outputs.releases != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.releases) }}
    uses: ./.github/workflows/build-mod.yml
    with:
      release: ${{ matrix.release }}
      key: ${{ matrix.key }}
      builder: b
      runner: ubuntu-22.04
      registry_ref: ${{ github.sha }}
      tools_ref: ${{ github.sha }}

  sign:
    needs: [pending, build-a, build-b]
    if: needs.pending.outputs.releases != '[]'
    runs-on: ubuntu-latest
    environment: registry-signing
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: ./gradlew --no-daemon -q :cli:installDist
      - uses: actions/download-artifact@v4
        with:
          name: build-a-${{ matrix.key }}
          path: a
      - uses: actions/download-artifact@v4
        with:
          name: build-b-${{ matrix.key }}
          path: b
      - name: Check both builds and scan
        run: |
          diff -q a/sha256.txt b/sha256.txt || { echo "::error::builds differ"; exit 1; }
          i=0
          while read -r sha path; do
            test "$(sha256sum "a/$i.jar" | cut -d' ' -f1)" = "$sha"
            cli/build/install/bcz/bin/bcz scan "a/$i.jar" --format markdown >> "$GITHUB_STEP_SUMMARY"
            i=$((i + 1))
          done < a/sha256.txt
      - name: Write and sign the build record
        env:
          RELEASE: ${{ matrix.release }}
          REGISTRY_KEY: ${{ secrets.BITECHECK_REGISTRY_KEY }}
        run: |
          if [ -z "$REGISTRY_KEY" ]; then
            echo "::warning::BITECHECK_REGISTRY_KEY is not set; build record not signed"
            exit 0
          fi
          umask 077
          printf '%s\n' "$REGISTRY_KEY" > "$RUNNER_TEMP/registry.key"
          bcz=cli/build/install/bcz/bin/bcz
          jars=()
          n=$(wc -l < a/sha256.txt)
          for ((i = 0; i < n; i++)); do jars+=("a/$i.jar"); done
          $bcz build-record "$RELEASE" "${jars[@]}" --builder github-ubuntu-24.04 --builder github-ubuntu-22.04
          build="${RELEASE%.toml}.build.toml"
          $bcz sign "$build" --key "$RUNNER_TEMP/registry.key"
          rm -f "$RUNNER_TEMP/registry.key"
          $bcz verify-sig "$build" --pub keys/registry.pub
          git config user.name "BiteCheck Registry"
          git config user.email "registry@users.noreply.github.com"
          git add "$build" "$build.sig"
          git commit -q -m "Build record for ${RELEASE#registry/mods/}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

  analysis-pending:
    needs: [pending, sign]
    if: ${{ !cancelled() && needs.pending.result == 'success' && needs.sign.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.find.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # includes the build records the sign job just pushed
          persist-credentials: false
      - id: find
        run: python3 .github/scripts/pending_analysis.py >> "$GITHUB_OUTPUT"

  build-ai:
    needs: analysis-pending
    if: ${{ !cancelled() && needs.analysis-pending.outputs.releases != '[]' && needs.analysis-pending.outputs.releases != '' }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.analysis-pending.outputs.releases) }}
    uses: ./.github/workflows/build-mod.yml
    with:
      release: ${{ matrix.release }}
      key: ${{ matrix.key }}
      builder: ai
      runner: ubuntu-24.04
      registry_ref: main
      tools_ref: ${{ github.sha }}

  analyze:
    # Runs the model on untrusted mod files: no registry key here, only the AI credential.
    needs: [analysis-pending, build-ai]
    if: ${{ !cancelled() && needs.build-ai.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ai-review
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.analysis-pending.outputs.releases) }}
    env:
      BACKEND: ${{ vars.AI_PREREVIEW_BACKEND || 'copilot' }}
      MODEL: ${{ vars.AI_PREREVIEW_MODEL || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: ./gradlew --no-daemon -q :cli:installDist
      - uses: actions/download-artifact@v4
        with:
          name: build-ai-${{ matrix.key }}
          path: jars
      - name: Check the jars against the signed build record
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          build="${RELEASE%.toml}.build.toml"
          cli/build/install/bcz/bin/bcz verify-sig "$build" --pub keys/registry.pub
          while read -r sha path; do
            grep -q "$sha" "$build" || { echo "::error::$path ($sha) is not in the build record"; exit 1; }
          done < jars/sha256.txt
      - name: Fetch the source at the release commit
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          info=$(cli/build/install/bcz/bin/bcz release-info "$RELEASE" --registry .)
          source=$(printf '%s\n' "$info" | sed -n 's/^source=//p')
          commit=$(printf '%s\n' "$info" | sed -n 's/^commit=//p')
          case "$commit" in *[!0-9a-f]*|"") echo "::error::bad commit"; exit 1;; esac
          git init -q src && git -C src remote add origin "$source"
          git -C src fetch -q --depth 1 origin "$commit" && git -C src checkout -q FETCH_HEAD
      - name: Install Copilot CLI
        if: env.BACKEND == 'copilot'
        run: npm install -g @github/copilot
      - name: AI pre-analysis
        env:
          RELEASE: ${{ matrix.release }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$BACKEND" = copilot ] && [ -z "$COPILOT_GITHUB_TOKEN" ]; then echo "::warning::COPILOT_GITHUB_TOKEN is not set"; exit 1; fi
          if [ "$BACKEND" = anthropic ] && [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY is not set"; exit 1; fi
          model=(); [ -n "$MODEL" ] && model=(--model "$MODEL")
          python3 -I .github/scripts/ai_prereview.py --backend "$BACKEND" "${model[@]}" --effort high \
            --release "$RELEASE" --src src --jars jars --bcz cli/build/install/bcz/bin/bcz \
            --report out/report.md --result out/result.json
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ matrix.key }}
          path: out/
          retention-days: 30

  analysis-sign:
    needs: [analysis-pending, analyze]
    if: ${{ !cancelled() && needs.analysis-pending.outputs.releases != '[]' && needs.analysis-pending.outputs.releases != '' }}
    runs-on: ubuntu-latest
    environment: registry-signing
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.analysis-pending.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: ./gradlew --no-daemon -q :cli:installDist
      - uses: actions/download-artifact@v4
        id: report
        continue-on-error: true # no artifact = this analysis failed; retried on the next run
        with:
          name: analysis-${{ matrix.key }}
          path: out
      - name: Write, sign and commit the analysis record
        if: steps.report.outcome == 'success'
        env:
          RELEASE: ${{ matrix.release }}
          REGISTRY_KEY: ${{ secrets.BITECHECK_REGISTRY_KEY }}
        run: |
          get() { python3 -I -c 'import json,sys;print(json.load(open("out/result.json"))[sys.argv[1]])' "$1"; }
          verdict=$(get verdict); summary=$(get summary); model=$(get model); effort=$(get effort)
          case "$verdict" in no-concerns|concerns) ;; *) echo "::error::bad verdict"; exit 1;; esac
          bcz=cli/build/install/bcz/bin/bcz
          $bcz analysis-record "$RELEASE" --model "$model" --effort "$effort" --verdict "$verdict" \
            --summary "$summary" --report out/report.md
          umask 077
          printf '%s\n' "$REGISTRY_KEY" > "$RUNNER_TEMP/registry.key"
          record="${RELEASE%.toml}.analysis.toml"
          $bcz sign "$record" --key "$RUNNER_TEMP/registry.key"
          rm -f "$RUNNER_TEMP/registry.key"
          $bcz verify-sig "$record" --pub keys/registry.pub
          git config user.name "BiteCheck Registry"
          git config user.email "registry@users.noreply.github.com"
          git add "$record" "$record.sig" "${RELEASE%.toml}.analysis.md"
          git commit -q -m "AI pre-analysis for ${RELEASE#registry/mods/}: $verdict"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

  index:
    needs: [pending, sign, analysis-sign]
    if: ${{ !cancelled() && needs.pending.result == 'success' && needs.sign.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: registry-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: ./gradlew --no-daemon -q :cli:installDist
      - name: Check the registry
        run: |
          if [ -f keys/registry.pub ]; then
            cli/build/install/bcz/bin/bcz lint --registry-key keys/registry.pub
          else
            cli/build/install/bcz/bin/bcz lint
          fi
      - name: Generate, sign and publish the index
        env:
          REGISTRY_KEY: ${{ secrets.BITECHECK_REGISTRY_KEY }}
        run: |
          if [ -z "$REGISTRY_KEY" ] || [ ! -f keys/registry.pub ]; then
            echo "::warning::registry key not set up; index not published"
            exit 0
          fi
          umask 077
          printf '%s\n' "$REGISTRY_KEY" > "$RUNNER_TEMP/registry.key"
          bcz=cli/build/install/bcz/bin/bcz
          out="$RUNNER_TEMP/index"
          mkdir -p "$out"
          $bcz index --registry-key keys/registry.pub --out "$out/index.toml" --commit "$(git rev-parse HEAD)"
          $bcz sign "$out/index.toml" --key "$RUNNER_TEMP/registry.key"
          rm -f "$RUNNER_TEMP/registry.key"
          $bcz verify-sig "$out/index.toml" --pub keys/registry.pub
          printf 'Signed BiteCheck index, published by CI. Do not edit.\n' > "$out/README.md"
          git config user.name "BiteCheck Registry"
          git config user.email "registry@users.noreply.github.com"
          git checkout -q --orphan index-publish
          git rm -rq --cached .
          git clean -fdxq -e cli/build
          cp "$out/index.toml" "$out/index.toml.sig" "$out/README.md" .
          git add index.toml index.toml.sig README.md
          git commit -q -m "Index $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f origin index-publish:index
          echo "Published index with $(grep -c '^[0-9a-f]\{64\} =' index.toml) entries" >> "$GITHUB_STEP_SUMMARY"
