# Runs on main after a pull request was merged, monthly and on demand:
#   1. builds every release that has no build record yet, twice, without secrets,
#      (and, for "workshop" releases, fetches the Steam Workshop jars in a job without secrets),
#   2. signs a build record with the registry key if both builds match (workshop: the Workshop
#      jars have exactly the files both builds produced) and the scan is clean,
#   3. publishes the signed launcher index to the "index" branch.
# The registry key is a secret (BITECHECK_REGISTRY_KEY) in the "registry-signing" environment.
# Between runs, timestamp.yml confirms daily (without an approval) that the index is still current.
name: Registry

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "keys/**"
  schedule:
    - cron: "17 3 1 * *" # timestamps keep an index fresh for at most 45 days after it was signed
  workflow_dispatch:

concurrency:
  group: registry-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pending:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.find.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: find
        run: python3 .github/scripts/pending.py >> "$GITHUB_OUTPUT"

  build-a:
    needs: pending
    if: needs.pending.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.releases) }}
    uses: ./.github/workflows/build-mod.yml
    with:
      release: ${{ matrix.release }}
      key: ${{ matrix.key }}
      builder: a
      runner: ubuntu-24.04
      registry_ref: ${{ github.sha }}
      tools_ref: ${{ github.sha }}

  build-b:
    needs: pending
    if: needs.pending.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.releases) }}
    uses: ./.github/workflows/build-mod.yml
    with:
      release: ${{ matrix.release }}
      key: ${{ matrix.key }}
      builder: b
      runner: ubuntu-22.04
      registry_ref: ${{ github.sha }}
      tools_ref: ${{ github.sha }}

  workshop:
    needs: pending
    if: needs.pending.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.releases) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: bash .github/scripts/build-bcz.sh
      - name: Fetch the Workshop jars
        id: fetch
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          bcz=cli/build/install/bcz/bin/bcz
          if $bcz release-info "$RELEASE" --registry . | grep -qx 'type=workshop'; then
            bash .github/scripts/fetch-workshop.sh "$bcz" "$RELEASE" . workshop
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # Uploading fails if an artifact with this name already exists (e.g. one a build job made).
      - uses: actions/upload-artifact@v7
        if: steps.fetch.outputs.found == 'true'
        with:
          name: workshop-${{ matrix.key }}
          path: workshop/
          retention-days: 1

  sign:
    needs: [pending, build-a, build-b, workshop]
    # also for the other releases when one release's build failed (its own leg fails on the missing artifact)
    if: ${{ !cancelled() && needs.pending.outputs.releases != '[]' }}
    runs-on: ubuntu-latest
    environment: registry-signing
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.releases) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: bash .github/scripts/build-bcz.sh
      - uses: actions/download-artifact@v8
        with:
          name: build-a-${{ matrix.key }}
          path: a
      - uses: actions/download-artifact@v8
        with:
          name: build-b-${{ matrix.key }}
          path: b
      - name: Read the release
        id: info
        env:
          RELEASE: ${{ matrix.release }}
        run: cli/build/install/bcz/bin/bcz release-info "$RELEASE" --registry . | grep '^type=' >> "$GITHUB_OUTPUT"
      # Only the trusted workshop job's artifact: if its upload failed (the name was taken), stop.
      - name: Require the Workshop jars from the workshop job
        if: steps.info.outputs.type == 'workshop' && needs.workshop.result != 'success'
        run: |
          echo "::error::the workshop job did not succeed, so its Workshop jars cannot be trusted"
          exit 1
      - uses: actions/download-artifact@v8
        if: steps.info.outputs.type == 'workshop'
        with:
          name: workshop-${{ matrix.key }}
          path: workshop
      - name: Check both builds and scan
        env:
          RELEASE: ${{ matrix.release }}
        run: bash .github/scripts/check-builds.sh cli/build/install/bcz/bin/bcz "$RELEASE" .
      - name: Write and sign the build record
        env:
          RELEASE: ${{ matrix.release }}
          REGISTRY_KEY: ${{ secrets.BITECHECK_REGISTRY_KEY }}
        run: |
          if [ -z "$REGISTRY_KEY" ]; then
            echo "::warning::BITECHECK_REGISTRY_KEY is not set; build record not signed"
            exit 0
          fi
          # Runs are serialized, but this one chose its releases when it started; an earlier run
          # that waited for the same approval may have signed this release since.
          if [ -f "${RELEASE%.toml}.build.toml" ]; then
            echo "::notice::${RELEASE#registry/mods/} already has a build record (signed by an earlier run)"
            exit 0
          fi
          umask 077
          printf '%s\n' "$REGISTRY_KEY" > "$RUNNER_TEMP/registry.key"
          bcz=cli/build/install/bcz/bin/bcz
          jars=()
          n=$(find final -name '*.jar' | wc -l)
          for ((i = 0; i < n; i++)); do jars+=("final/$i.jar"); done
          $bcz build-record "$RELEASE" "${jars[@]}" --builder github-ubuntu-24.04 --builder github-ubuntu-22.04
          build="${RELEASE%.toml}.build.toml"
          $bcz sign "$build" --key "$RUNNER_TEMP/registry.key"
          rm -f "$RUNNER_TEMP/registry.key"
          $bcz verify-sig "$build" --pub keys/registry.pub
          git config user.name "BiteCheck Registry"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$build" "$build.sig"
          git commit -q -m "Build record for ${RELEASE#registry/mods/}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

  index:
    needs: [pending, sign]
    # also when one release failed: the index only lists what has a signed build record
    if: ${{ !cancelled() && needs.pending.result == 'success' }}
    runs-on: ubuntu-latest
    environment: registry-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: bash .github/scripts/build-bcz.sh
      - name: Check the registry
        run: |
          if [ -f keys/registry.pub ]; then
            cli/build/install/bcz/bin/bcz lint --registry-key keys/registry.pub
          else
            cli/build/install/bcz/bin/bcz lint
          fi
      - name: Generate, sign and publish the index
        env:
          REGISTRY_KEY: ${{ secrets.BITECHECK_REGISTRY_KEY }}
        run: |
          if [ -z "$REGISTRY_KEY" ] || [ ! -f keys/registry.pub ]; then
            echo "::warning::registry key not set up; index not published"
            exit 0
          fi
          umask 077
          printf '%s\n' "$REGISTRY_KEY" > "$RUNNER_TEMP/registry.key"
          bcz=cli/build/install/bcz/bin/bcz
          out="$RUNNER_TEMP/index"
          mkdir -p "$out"
          $bcz index --registry-key keys/registry.pub --out "$out/index.toml" --commit "$(git rev-parse HEAD)"
          $bcz sign "$out/index.toml" --key "$RUNNER_TEMP/registry.key"
          rm -f "$RUNNER_TEMP/registry.key"
          $bcz verify-sig "$out/index.toml" --pub keys/registry.pub
          printf 'Signed BiteCheck index, published by CI. Do not edit.\n' > "$out/README.md"
          git config user.name "BiteCheck Registry"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan index-publish
          git rm -rq --cached .
          git clean -fdxq -e cli/build
          cp "$out/index.toml" "$out/index.toml.sig" "$out/README.md" .
          git add index.toml index.toml.sig README.md
          git commit -q -m "Index $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f origin index-publish:index
          echo "Published index with $(grep -c '^[0-9a-f]\{64\} =' index.toml) entries" >> "$GITHUB_STEP_SUMMARY"
