# Runs on main after a pull request was merged, daily and on demand:
#   1. builds every release that has no build record yet, twice, without secrets,
#   2. signs a build record with the registry key if both builds match and the scan is clean,
#   3. publishes the signed launcher index to the "index" branch.
# The registry key is a secret (BITECHECK_REGISTRY_KEY) in the "registry-signing" environment.
name: Registry

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "keys/**"
  schedule:
    - cron: "17 3 * * *" # keeps the index fresh; launchers distrust indexes older than 7 days
  workflow_dispatch:

concurrency:
  group: registry-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pending:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.find.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: find
        run: python3 .github/scripts/pending.py >> "$GITHUB_OUTPUT"

  build-a:
    needs: pending
    if: needs.pending.outputs.releases != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.releases) }}
    uses: ./.github/workflows/build-mod.yml
    with:
      release: ${{ matrix.release }}
      key: ${{ matrix.key }}
      builder: a
      runner: ubuntu-24.04
      registry_ref: ${{ github.sha }}
      tools_ref: ${{ github.sha }}

  build-b:
    needs: pending
    if: needs.pending.outputs.releases != '[]'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.releases) }}
    uses: ./.github/workflows/build-mod.yml
    with:
      release: ${{ matrix.release }}
      key: ${{ matrix.key }}
      builder: b
      runner: ubuntu-22.04
      registry_ref: ${{ github.sha }}
      tools_ref: ${{ github.sha }}

  sign:
    needs: [pending, build-a, build-b]
    if: needs.pending.outputs.releases != '[]'
    runs-on: ubuntu-latest
    environment: registry-signing
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.releases) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: ./gradlew --no-daemon -q :cli:installDist
      - uses: actions/download-artifact@v8
        with:
          name: build-a-${{ matrix.key }}
          path: a
      - uses: actions/download-artifact@v8
        with:
          name: build-b-${{ matrix.key }}
          path: b
      - name: Check both builds and scan
        run: |
          if [ -f a/game.txt ] || [ -f b/game.txt ]; then
            cmp -s a/game.txt b/game.txt || { echo "::error::the game updated between the two builds, re-run"; diff a/game.txt b/game.txt || true; exit 1; }
            { echo "Game build:"; echo '```'; cat a/game.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          diff -q a/sha256.txt b/sha256.txt || { echo "::error::builds differ"; exit 1; }
          i=0
          while read -r sha path; do
            test "$(sha256sum "a/$i.jar" | cut -d' ' -f1)" = "$sha"
            cli/build/install/bcz/bin/bcz scan "a/$i.jar" --format markdown >> "$GITHUB_STEP_SUMMARY"
            i=$((i + 1))
          done < a/sha256.txt
      - name: Write and sign the build record
        env:
          RELEASE: ${{ matrix.release }}
          REGISTRY_KEY: ${{ secrets.BITECHECK_REGISTRY_KEY }}
        run: |
          if [ -z "$REGISTRY_KEY" ]; then
            echo "::warning::BITECHECK_REGISTRY_KEY is not set; build record not signed"
            exit 0
          fi
          umask 077
          printf '%s\n' "$REGISTRY_KEY" > "$RUNNER_TEMP/registry.key"
          bcz=cli/build/install/bcz/bin/bcz
          jars=()
          n=$(wc -l < a/sha256.txt)
          for ((i = 0; i < n; i++)); do jars+=("a/$i.jar"); done
          $bcz build-record "$RELEASE" "${jars[@]}" --builder github-ubuntu-24.04 --builder github-ubuntu-22.04
          build="${RELEASE%.toml}.build.toml"
          $bcz sign "$build" --key "$RUNNER_TEMP/registry.key"
          rm -f "$RUNNER_TEMP/registry.key"
          $bcz verify-sig "$build" --pub keys/registry.pub
          git config user.name "BiteCheck Registry"
          git config user.email "registry@users.noreply.github.com"
          git add "$build" "$build.sig"
          git commit -q -m "Build record for ${RELEASE#registry/mods/}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

  index:
    needs: [pending, sign]
    if: ${{ !cancelled() && needs.pending.result == 'success' && needs.sign.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: registry-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: ./gradlew --no-daemon -q :cli:installDist
      - name: Check the registry
        run: |
          if [ -f keys/registry.pub ]; then
            cli/build/install/bcz/bin/bcz lint --registry-key keys/registry.pub
          else
            cli/build/install/bcz/bin/bcz lint
          fi
      - name: Generate, sign and publish the index
        env:
          REGISTRY_KEY: ${{ secrets.BITECHECK_REGISTRY_KEY }}
        run: |
          if [ -z "$REGISTRY_KEY" ] || [ ! -f keys/registry.pub ]; then
            echo "::warning::registry key not set up; index not published"
            exit 0
          fi
          umask 077
          printf '%s\n' "$REGISTRY_KEY" > "$RUNNER_TEMP/registry.key"
          bcz=cli/build/install/bcz/bin/bcz
          out="$RUNNER_TEMP/index"
          mkdir -p "$out"
          $bcz index --registry-key keys/registry.pub --out "$out/index.toml" --commit "$(git rev-parse HEAD)"
          $bcz sign "$out/index.toml" --key "$RUNNER_TEMP/registry.key"
          rm -f "$RUNNER_TEMP/registry.key"
          $bcz verify-sig "$out/index.toml" --pub keys/registry.pub
          printf 'Signed BiteCheck index, published by CI. Do not edit.\n' > "$out/README.md"
          git config user.name "BiteCheck Registry"
          git config user.email "registry@users.noreply.github.com"
          git checkout -q --orphan index-publish
          git rm -rq --cached .
          git clean -fdxq -e cli/build
          cp "$out/index.toml" "$out/index.toml.sig" "$out/README.md" .
          git add index.toml index.toml.sig README.md
          git commit -q -m "Index $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f origin index-publish:index
          echo "Published index with $(grep -c '^[0-9a-f]\{64\} =' index.toml) entries" >> "$GITHUB_STEP_SUMMARY"
