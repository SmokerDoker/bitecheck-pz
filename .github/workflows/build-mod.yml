# Produces the jars of one mod release from its public source repository at the release commit.
# Used twice per release (two independent runners) by submission.yml and registry.yml. Has no
# secrets and read-only access.
#   type "rebuild":   builds the jar with the release's build command (reproducible build)
#   type "workshop":  builds the jar(s) the same way; the jobs that compare builder a and b then
#                     check that the Steam Workshop item's jars have exactly these files
#   type "published": takes the jar(s) the author committed in the repository at that commit
#
# Rebuilds compile against the game's own classes, which must not be redistributed. They come from
# the free Project Zomboid Dedicated Server (Steam app 380870, anonymous login): DepotDownloader
# (pinned by SHA-256, checks every chunk against Valve's manifest) fetches only
# java/projectzomboid.jar, outside the mod source; the build command finds it through PZ_GAME_DIR
# (the BiteCheck Gradle plugin reads it). Optional release field [build] game_branch selects a
# Steam beta branch. The game files are not cached and not uploaded, and a jar that contains
# classes of the game fails the build (this catches accidental bundling; the untrusted build
# command itself runs next to the game files and is not sandboxed). The depot manifest ids and the
# jar's SHA-256 go into the step summary and out/game.txt; the jobs comparing builder a and b fail
# if they used different game files.
# Not cached on purpose: the untrusted build command runs in these jobs (also on main) and could
# poison a shared cache that later builds of other mods would restore. bcz is built with javac
# (.github/scripts/build-bcz.sh) before any untrusted code runs, for the same reason.
# Build commands also get ZOMBIEBUDDY_JAR, the ZombieBuddy API jar (pinned by SHA-256), for builds
# that do not fetch it themselves (e.g. Maven: mvn install:install-file -Dfile=$ZOMBIEBUDDY_JAR).
name: Build mod (reusable)

on:
  workflow_call:
    inputs:
      release:
        description: Path of the release file, e.g. registry/mods/my-mod/releases/1.0.0.toml
        type: string
        required: true
      key:
        description: Short unique name for artifacts
        type: string
        required: true
      builder:
        description: Builder name (a or b)
        type: string
        required: true
      runner:
        type: string
        required: true
      registry_ref:
        description: Commit of the registry that contains the release
        type: string
        required: true
      tools_ref:
        description: Trusted commit to build the bcz tool from
        type: string
        required: true

permissions:
  contents: read

env:
  ZOMBIEBUDDY_VERSION: "2.3.4"
  ZOMBIEBUDDY_SHA256: eb79b9876332010733a8e0d7ce4fe0377846059a9e28859029e2a0fb449f6cf2

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the trusted bcz tool
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tools_ref }}
          path: tools
          persist-credentials: false
      - name: Check out the registry
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.registry_ref }}
          path: registry
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: bash tools/.github/scripts/build-bcz.sh tools
      - name: Read the release
        id: info
        env:
          RELEASE: ${{ inputs.release }}
        run: tools/cli/build/install/bcz/bin/bcz release-info "registry/$RELEASE" --registry registry >> "$GITHUB_OUTPUT"
      - name: Set up the mod's JDK
        if: steps.info.outputs.type != 'published'
        uses: actions/setup-java@v5
        with:
          distribution: ${{ steps.info.outputs.jdk_distribution }}
          java-version: ${{ steps.info.outputs.jdk_version }}
      - name: Check the game branch
        id: branch
        if: steps.info.outputs.type != 'published'
        env:
          GAME_BRANCH: ${{ steps.info.outputs.game_branch }}
        run: |
          set -euo pipefail
          branch="${GAME_BRANCH:-public}"
          # a Steam beta branch name; it ends up on the DepotDownloader command line
          if ! [[ "$branch" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::[build] game_branch may only contain letters, digits, '-', '_' and '.'"
            exit 1
          fi
          # Build 41 has no projectzomboid.jar (loose classes), and ZombieBuddy needs Build 42+
          if [ "$branch" = legacy41 ]; then
            echo "::error::Build 41 (game_branch legacy41) is not supported: ZombieBuddy needs Build 42 or newer"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Download the game jar
        id: game
        if: steps.info.outputs.type != 'published'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          RUNNER_LABEL: ${{ inputs.runner }}
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          set -euo pipefail
          dd="$(bash tools/.github/scripts/depotdownloader.sh)"
          tool="$(dirname "$dd")"
          dir="$RUNNER_TEMP/pz-server"
          mkdir -p "$dir"
          # only the jar the mod compiles against, not the whole server
          printf '%s\n' 'java/projectzomboid.jar' 'regex:projectzomboid\.jar$' > "$tool/files.txt"
          installed=false
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/depotdownloader-$attempt.log"
            if "$dd" -app 380870 -os linux -osarch 64 -branch "$BRANCH" \
                 -filelist "$tool/files.txt" -dir "$dir" > "$log" 2>&1 \
               && [ -f "$dir/java/projectzomboid.jar" ]; then
              installed=true
              break
            fi
            tail -n 20 "$log"
            echo "::warning::download attempt $attempt failed, retrying"
            sleep 15
          done
          cat "$log"
          if [ "$installed" != true ]; then
            echo "::error::could not download projectzomboid.jar (Steam app 380870, branch $BRANCH)"
            exit 1
          fi
          # DepotDownloader silently falls back to "public" for a branch it cannot find
          if grep -q 'does not have branch named' "$log"; then
            echo "::error::Steam app 380870 has no public branch '$BRANCH' ([build] game_branch); password-protected branches are not supported"
            exit 1
          fi
          # depot:manifest pairs, from "Processing depot D" + "Manifest M (date)" or "Already have manifest M for depot D"
          manifests="$(awk '/^Processing depot [0-9]+$/ {d=$3}
            /^Manifest [0-9]+ / && d {print d ":" $2}
            /^Already have manifest [0-9]+ for depot [0-9]+/ {sub(/\.$/, "", $7); print $7 ":" $4}' "$log" \
            | sort -u | paste -sd, -)"
          if [ -z "$manifests" ]; then
            echo "::error::no depot manifest id in the DepotDownloader output"
            exit 1
          fi
          jar_sha="$(sha256sum "$dir/java/projectzomboid.jar" | cut -d' ' -f1)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          {
            echo "app=380870"
            echo "branch=$BRANCH"
            echo "manifests=$manifests"
            echo "projectzomboid_jar_sha256=$jar_sha"
          } > "$RUNNER_TEMP/game.txt"
          {
            echo "Game ($RUNNER_LABEL): Project Zomboid Dedicated Server (Steam app 380870), branch \`$BRANCH\`, depot manifest \`$manifests\`, projectzomboid.jar \`$jar_sha\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download the ZombieBuddy API jar
        id: zombiebuddy
        if: steps.info.outputs.type != 'published'
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/zombiebuddy/ZombieBuddy-$ZOMBIEBUDDY_VERSION.jar"
          mkdir -p "$(dirname "$jar")"
          curl -fsSL -o "$jar" "https://github.com/zed-0xff/ZombieBuddy/releases/download/v$ZOMBIEBUDDY_VERSION/ZombieBuddy.jar"
          echo "$ZOMBIEBUDDY_SHA256  $jar" | sha256sum -c --quiet
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
      - name: Fetch the source at the exact commit
        env:
          SOURCE: ${{ steps.info.outputs.source }}
          COMMIT: ${{ steps.info.outputs.commit }}
        run: |
          git init -q src
          git -C src remote add origin "$SOURCE"
          git -C src fetch -q --depth 1 origin "$COMMIT"
          git -C src checkout -q FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = "$COMMIT"
      - name: Build the mod
        if: steps.info.outputs.type != 'published'
        working-directory: src
        env:
          BUILD_COMMAND: ${{ steps.info.outputs.command }}
          PZ_GAME_DIR: ${{ steps.game.outputs.dir }}
          ZOMBIEBUDDY_JAR: ${{ steps.zombiebuddy.outputs.jar }}
        run: bash -c "$BUILD_COMMAND"
      - name: Hash the jars
        env:
          ARTIFACTS: ${{ steps.info.outputs.artifacts }}
          PZ_GAME_DIR: ${{ steps.game.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir out
          : > out/sha256.txt
          if [ -n "${PZ_GAME_DIR:-}" ]; then
            # the game is compileOnly: its classes must never end up in (and be published with) a mod jar
            unzip -Z1 "$PZ_GAME_DIR/java/projectzomboid.jar" | grep '\.class$' | sort -u > "$RUNNER_TEMP/game-classes.txt"
            cp "$RUNNER_TEMP/game.txt" out/game.txt
          fi
          i=0
          for artifact in $ARTIFACTS; do
            test -f "src/$artifact" || { echo "::error::artifact $artifact not found"; exit 1; }
            cp "src/$artifact" "out/$i.jar"
            if [ -n "${PZ_GAME_DIR:-}" ]; then
              { unzip -Z1 "out/$i.jar" | grep '\.class$' || true; } | sort -u \
                | comm -12 - "$RUNNER_TEMP/game-classes.txt" > "$RUNNER_TEMP/bundled.txt"
              if [ -s "$RUNNER_TEMP/bundled.txt" ]; then
                rm -rf out
                echo "::error::$artifact contains $(wc -l < "$RUNNER_TEMP/bundled.txt") classes of the game, which must be compileOnly, e.g. $(sed -n 1p "$RUNNER_TEMP/bundled.txt")"
                exit 1
              fi
            fi
            echo "$(sha256sum "out/$i.jar" | cut -d' ' -f1)  $artifact" >> out/sha256.txt
            i=$((i + 1))
          done
          { echo "SHA-256 (${{ inputs.runner }}):"; echo '```'; cat out/sha256.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.builder }}-${{ inputs.key }}
          path: out/
          retention-days: 30
