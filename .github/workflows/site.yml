# Builds the registry website (bcz site) and publishes it with GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until then the deploy step is skipped with a warning; the built page is kept as an artifact.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "keys/**"
      - "docs/reviews/**"
      - "core/src/main/java/io/github/bitecheckpz/core/Site.java"
  workflow_run:
    # build records and index are pushed by the Registry workflow, which does not trigger push events
    workflows: [Registry]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: ./gradlew --no-daemon -q :cli:installDist
      - name: Generate the site
        run: |
          key=()
          [ -f keys/registry.pub ] && key=(--registry-key keys/registry.pub)
          cli/build/install/bcz/bin/bcz site "${key[@]}" --out _site \
            --repo-url "${{ github.server_url }}/${{ github.repository }}"
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: echo "::warning::GitHub Pages is not enabled yet (Settings > Pages > Source - GitHub Actions)."
