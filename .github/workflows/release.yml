# Tag v0.1.0 (etc.) to publish the launcher and bcz downloads as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon check :launcher:launcherZip :cli:distZip -PbitecheckVersion="$version"
      - name: Checksums
        run: |
          mkdir dist
          cp launcher/build/distributions/*.zip cli/build/distributions/*.zip dist/
          cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "BiteCheck $GITHUB_REF_NAME" --generate-notes
