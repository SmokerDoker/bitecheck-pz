# Runs on pull requests that add or change a release: builds the mod twice on independent
# runners, compares the hashes and scans the jar. For a "workshop" release it also downloads the
# Steam Workshop item and checks that its jars have exactly the files both runners built. Results
# go to the run summary; the jars (artifact mod-<key>) are uploaded so reviewers can review
# exactly what will be verified.
name: Mod submission

on:
  pull_request:
    paths:
      - "registry/mods/*/releases/*.toml"

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.find.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: find
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=AM "$BASE"...HEAD \
            | grep -E '^registry/mods/[a-z0-9][a-z0-9-]*/releases/[0-9A-Za-z][0-9A-Za-z.+_-]*\.toml$' \
            | grep -v '\.build\.toml$' > releases.txt || true
          python3 .github/scripts/matrix.py releases.txt >> "$GITHUB_OUTPUT"

  build-a:
    needs: detect
    if: needs.detect.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.releases) }}
    uses: ./.github/workflows/build-mod.yml
    with:
      release: ${{ matrix.release }}
      key: ${{ matrix.key }}
      builder: a
      runner: ubuntu-24.04
      registry_ref: ${{ github.event.pull_request.head.sha }}
      tools_ref: ${{ github.event.pull_request.base.sha }}

  build-b:
    needs: detect
    if: needs.detect.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.releases) }}
    uses: ./.github/workflows/build-mod.yml
    with:
      release: ${{ matrix.release }}
      key: ${{ matrix.key }}
      builder: b
      runner: ubuntu-22.04
      registry_ref: ${{ github.event.pull_request.head.sha }}
      tools_ref: ${{ github.event.pull_request.base.sha }}

  compare:
    needs: [detect, build-a, build-b]
    # also for the other releases when one release's build failed (its own compare fails on the missing artifact)
    if: ${{ !cancelled() && needs.detect.outputs.releases != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.releases) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check out the pull request's registry files
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz
        run: bash .github/scripts/build-bcz.sh
      - name: Read the release
        id: info
        env:
          RELEASE: ${{ matrix.release }}
        run: cli/build/install/bcz/bin/bcz release-info "pr/$RELEASE" --registry pr | grep '^type=' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: build-a-${{ matrix.key }}
          path: a
      - uses: actions/download-artifact@v8
        with:
          name: build-b-${{ matrix.key }}
          path: b
      - name: Fetch the Workshop jars
        if: steps.info.outputs.type == 'workshop'
        env:
          RELEASE: ${{ matrix.release }}
        run: bash .github/scripts/fetch-workshop.sh cli/build/install/bcz/bin/bcz "pr/$RELEASE" pr workshop
      - name: Compare the builds and scan the jars
        env:
          RELEASE: ${{ matrix.release }}
          KEY: ${{ matrix.key }}
        run: |
          echo "### Release \`$KEY\`" >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/check-builds.sh cli/build/install/bcz/bin/bcz "pr/$RELEASE" pr
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mod-${{ matrix.key }}
          path: final/
          if-no-files-found: ignore
          retention-days: 90
