name: Validate registry

on:
  pull_request:
    paths:
      - "registry/**"
      - "keys/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          path: pr
          fetch-depth: 0 # submitter-check compares with the base commit
          persist-credentials: false
      - name: Check out the trusted tools from the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every registry file is valid TOML
        working-directory: pr
        run: |
          python - <<'EOF'
          import pathlib, sys, tomllib
          errors = 0
          for path in sorted(pathlib.Path(".").glob("registry/**/*.toml")) + sorted(pathlib.Path(".").glob("keys/**/*.toml")):
              try:
                  tomllib.loads(path.read_text(encoding="utf-8"))
              except tomllib.TOMLDecodeError as e:
                  errors += 1
                  print(f"ERROR {path}: {e}")
          sys.exit(1 if errors else 0)
          EOF
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build bcz from the base branch
        run: bash base/.github/scripts/build-bcz.sh base
      - name: Lint names, fields and signatures
        run: |
          bcz=base/cli/build/install/bcz/bin/bcz
          if [ -f base/keys/registry.pub ]; then
            $bcz lint --registry pr --registry-key base/keys/registry.pub
          else
            $bcz lint --registry pr
          fi
      # Mods, releases and reviews may only be changed from the GitHub account linked to their
      # publisher or reviewer; anything else (reviewer levels, keys, removing flags) fails here
      # and needs a maintainer's look before merging.
      - name: Every change belongs to the pull request's author
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: base/cli/build/install/bcz/bin/bcz submitter-check --registry pr --login "$LOGIN" --base "$BASE"
