notes = "Compatibility fixes for older mods on newer B42 builds. Java part (143 lines): exposes MapItem.getSymbols to Lua (read-only), makes AnimNode.Parse return null instead of throwing an NPE, strips \"-- comment\" text from item header lines in ScriptParser.stripComments, drops item recipe-map entries pointing to missing evolved recipes, and logs nil reads in KahluaThread.tableget (log only, but on a hot path). No file, network, process, native code, class loading or reflection. ZModUnbork.jar matches the source at a9b3405; ZModUnbork-2x.jar is byte-identical to the build of the parent of 64d3fac (ZombieBuddy 2.x, fewer patches). Correctness note: the Lua part (not part of this review) changes many game classes and global functions through the zdk mod and can affect other mods. Workshop ID 3677147974 checked on Steam."
