notes = "Full review of ZombieBuddy 2.3.4 at tag v2.3.4 (commit 9a08a54): Agent, Loader, SelfUpdater, ZBSVerifier, KnownAuthors, SteamWorkshop, the approvals store, Config, JavaModInfo, Exposer, the core patches, the approval frontends, build.gradle and c/windows/zbNative.c. The CI rebuild (JDK 17, Gradle 9.3.1, shadowJar) has exactly the files of the Workshop jar; only the author's jarsigner signature is left out. Hard findings explained: the instrumentation API and ByteBuddy are what a mod loader needs to apply @Patch classes to game classes; the bundled byte-buddy-agent attach DLLs are never used, because ZombieBuddy is always started with -javaagent; the only process is ZombieBuddy's own Swing approval dialog (java from java.home); code loading is limited to adding mod jars to the classpath after a decision tied to their SHA-256 (rechecked just before loading) and redefining ZombieBuddy's own patch classes. Network: a signed authors.json from GitHub, the Steam Workshop details API (Workshop ids only) and Steam profile pages for author keys; no player data is sent and no code is downloaded. Self-update takes a ZombieBuddy jar from a local mod folder, checked against a pinned certificate and a newer version number. Files: ~/.zombie_buddy, the agent jar folder (update, .bak, .new) and temp files for the dialog. The Lua surface outside the opt-in 'experimental' agent arguments is harmless; the HTTP Lua server and the reflection helpers exist only with those arguments. Nothing obfuscated, nothing malicious. Security notes on ZombieBuddy's own protection against other mods were sent to the author privately. Correctness: game patches target methods by name and can break on game updates."
