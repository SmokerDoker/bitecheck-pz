notes = "Full review of the source at commit f95adf9: all 13 Java files (1517 lines). Times protected Lua calls (System.nanoTime) and draws the slowest as an overlay; arguments are only read. Lua can only set display/logging options (ZBLuaPerfMon), no paths or strings. Soft findings: lambdas/string concatenation; files: DebugLogger would write to the Zomboid cache dir (ZBLuaPerfMon_debug.log) but every call to it is commented out; PathParser only compares path strings (ZomboidFileSystem read only). No network, process or class-loading access. Not a security issue: per-call overhead while enabled; the -2x jar was compiled against the ZombieBuddy 2.x package name."
