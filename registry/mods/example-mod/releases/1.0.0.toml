# EXAMPLE ONLY - shows the format of a release file.
# Written and signed by the author (bcz sign 1.0.0.toml --key <author key> -> 1.0.0.toml.sig).
# After two identical CI builds, CI adds 1.0.0.build.toml, signed by the registry.
mod = "example-mod"
version = "1.0.0"
commit = "0000000000000000000000000000000000000000"

[build]
jdk = "temurin-25"
gradle = "9.1"
command = "./gradlew --no-daemon jar"
artifact = "build/libs/example-mod.jar"  # path of the built jar, relative to the project

[compat]
project_zomboid = ">=42.12"
zombiebuddy = ">=1.0.0, <2.0.0"
